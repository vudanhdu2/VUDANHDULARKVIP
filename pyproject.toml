[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "waytoagi"
version = "2.0.0"
description = "VUDANHDULARKVIP — clone, translate, mirror CN wiki to Larksuite VI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "VŨ DANH DỰ", email = "vudanhdu@example.com" },
]
keywords = ["lark", "feishu", "wiki", "translation", "mirror", "vietnamese"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Localization",
]

[project.urls]
Homepage = "https://github.com/vudanhdu2/VUDANHDULARKVIP"
Repository = "https://github.com/vudanhdu2/VUDANHDULARKVIP"
Issues = "https://github.com/vudanhdu2/VUDANHDULARKVIP/issues"

[project.scripts]
waytoagi = "waytoagi.cli:main"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "tenacity>=8.2",
    "aiolimiter>=1.1",
    "structlog>=24.0",
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",                  # CLI nice output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "respx>=0.21",                  # httpx mocking
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
waytoagi = "waytoagi.cli:main"

[project.urls]
Repository = "https://github.com/vudanhdu/vddclonelark-v2"

# ============================================================
# Tool config
# ============================================================

[tool.hatch.build.targets.wheel]
packages = ["src/waytoagi"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "RUF",          # ruff-specific
    "TRY",          # tryceratops (error handling)
    "SIM",          # flake8-simplify
    "PT",           # pytest style
    "TCH",          # type-checking
    "ASYNC",        # async patterns
]
ignore = [
    "TRY003",  # exception messages
    "B008",    # function call in argument default (Click)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiolimiter.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/waytoagi",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-fail-under=70",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests (no external services)",
    "integration: integration tests (mock Lark API)",
    "slow: tests that take >1s",
]

[tool.coverage.run]
source = ["src/waytoagi"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
